name: CI/CD Pipeline

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/eugenchornogorskiy/chmor-bezp/backend
  IMAGE_NAME_FRONTEND: ghcr.io/eugenchornogorskiy/chmor-bezp/frontend
  K8S_NAMESPACE: default

jobs: 
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm run test:unit
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PG_HOST: localhost
          BACKEND_PORT: 3000

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7
 
  build-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/new')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "new" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
          echo "SHORT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME_BACKEND }}:${{ steps.vars.outputs.TAG }}
            ${{ env.IMAGE_NAME_BACKEND }}:${{ steps.vars.outputs.SHORT_SHA }}
 
  build-frontend:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/new')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
          echo "SHORT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.vars.outputs.TAG }}
            ${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.vars.outputs.SHORT_SHA }}
 
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/new'
    environment:
      name: production
      url: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.28.0

      - name: Set tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "new" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi   

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k base/overlays/dev

      - name: Wait for rollouts
        run: | 
          kubectl rollout status deployment/api --timeout=300s
          kubectl rollout status deployment/nginx --timeout=300s
          kubectl rollout status deployment/postgres --timeout=300s
          kubectl rollout status deployment/redis --timeout=300s
          kubectl rollout status deployment/authentik --timeout=300s
          kubectl rollout status deployment/auth-postgres --timeout=300s

      - name: Get cluster status
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get networkpolicies 
