apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  labels:
    auth: authentik-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      auth: authentik-worker
  template:
    metadata:
      labels:
        auth: authentik-worker
    spec:
      containers: 
        - env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: auth-postgres
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  key: AUTH_PG_USER
                  name: auth-pg-user
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  key: AUTH_PG_PASSWORD
                  name: auth-pg-password 
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: AUTHENTIK_SECRET_KEY
                  name: auth-secret-key
            - name: AUTHENTIK_REDIS__HOST
              value: redis 
          image: ghcr.io/goauthentik/server:latest  
          command: ["worker"]
          name: authentik-worker
      restartPolicy: Always

